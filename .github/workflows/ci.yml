name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to a new release on its own
    # No secrets here: tests/conftest.py gives every test a placeholder for every
    # key in config.SECRET_ENV_VARS.
    steps:
      - uses: actions/checkout@v7
      # The audio tests generate and convert WAV files with ffmpeg.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # Exact tag: setup-uv publishes only release tags, no floating major tag (v10).
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest

  secret-scan:
    # gitleaks over the full git history. Chosen 2026-11-10: the gitleaks CLI is MIT and
    # needs no licence key for any repository; gitleaks-action (v3.0.0) is free for personal
    # accounts but under its own licence and needs a key for organizations, so the CLI is
    # run directly. trufflehog (AGPL) is free too, but by default verifies findings by
    # sending them to the providers. Exact release plus the SHA-256 of its asset (GitHub
    # release digest), pinned like setup-uv.
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # every commit, not only the last one
      - name: Install gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      # --redact: a finding is reported by rule, file and commit, never with its value.
      - name: Scan the full history
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner --verbose --exit-code 1'

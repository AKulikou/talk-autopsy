name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to a new release on its own
    env:
      # config.py fails fast without a key; the tests replace Claude with a fake
      # client, so this placeholder never reaches the API.
      ANTHROPIC_API_KEY: sk-ant-ci-placeholder
    steps:
      - uses: actions/checkout@v7
      # The audio tests generate and convert WAV files with ffmpeg.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # Exact tag: setup-uv publishes only release tags, no floating major tag (v10).
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest
